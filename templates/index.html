<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitBuddy AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #222;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
        }

        .hero {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #444;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            background: #eef8f0;
            border-radius: 10px;
            color: #286b35;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="hero">

        <h1>FitBuddy AI 🏋️</h1>

        <p class="subtitle">
            Generate a personalized AI workout plan and nutrition tip.
        </p>

        <form action="/generate-workout" method="post">

            <div class="form-group">
                <label for="username">Name</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="user_id">User ID</label>
                <input
                    type="text"
                    id="user_id"
                    name="user_id"
                    placeholder="Example: FB001"
                    required
                >
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="10"
                    max="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input
                    type="number"
                    id="weight"
                    name="weight"
                    step="0.1"
                    min="20"
                    max="300"
                    required
                >
            </div>

            <div class="form-group">
                <label for="goal">Fitness Goal</label>

                <select id="goal" name="goal" required>
                    <option value="">Select your goal</option>
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="General Fitness">General Fitness</option>
                    <option value="Strength">Strength</option>
                    <option value="Flexibility">Flexibility</option>
                </select>
            </div>

            <div class="form-group">
                <label for="intensity">Workout Intensity</label>

                <select id="intensity" name="intensity" required>
                    <option value="">Select intensity</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>

            <button type="submit">
                Generate My AI Workout Plan
            </button>

        </form>

        <div class="status">
            ✅ FitBuddy backend is connected successfully.
        </div>

    </div>

</div>

</body>
</html>
